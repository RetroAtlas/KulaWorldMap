<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>Kula World Map</title>
  <meta
    name="description"
    content="An interactive map of every level in Kula World (PlayStation), read from the game disc: all 230 levels across ten worlds, drawn block by block with every object where the game puts it."
  />
  <meta name="theme-color" content="#111725" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-96.png" sizes="96x96" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="canonical" href="https://kulaworld.retroatlas.org/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kulaworld.retroatlas.org/" />
  <meta property="og:title" content="Kula World Map" />
  <meta
    property="og:description"
    content="All 230 levels of Kula World across ten worlds, drawn block by block with every object where the game puts it."
  />
  <meta property="og:site_name" content="Kula World Map" />
  <meta property="og:image" content="https://kulaworld.retroatlas.org/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta
    property="og:image:alt"
    content="A Kula World level drawn block by block in the game's own textures"
  />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kula World Map" />
  <meta
    name="twitter:description"
    content="All 230 levels of Kula World across ten worlds, drawn block by block with every object where the game puts it."
  />
  <meta name="twitter:image" content="https://kulaworld.retroatlas.org/og-image.png" />
  <meta
    name="twitter:image:alt"
    content="A Kula World level drawn block by block in the game's own textures"
  />

  <!-- crossorigin matches fetch()'s cors mode, so the preload is used rather
       than fetched twice -->
  <link rel="preload" href="map_data.json" as="fetch" crossorigin />
  <link rel="stylesheet" href="css/main.css" />

  <button
    id="menuBtn"
    class="menu-btn"
    aria-controls="sidebar"
    aria-expanded="false"
    title="Levels and display (m)"
  >
    <span aria-hidden="true">☰</span><span class="sr">Levels and display</span>
  </button>

  <div id="say" class="sr" role="status" aria-live="polite"></div>

  <div id="scrim" class="scrim"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Levels and display">
      <div class="head">
        <h1 class="wordmark">Kula World <span>Map</span></h1>
        <button
          id="settingsBtn"
          class="gear"
          type="button"
          aria-haspopup="dialog"
          aria-controls="settings"
          aria-label="Settings"
          title="Settings (s)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
      <p id="about" class="about"></p>

      <div class="field">
        <label class="sr" for="search">Search</label>
        <input
          id="search"
          type="search"
          placeholder="level 42 · key · starts=off  ( / )"
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-controls="results"
          aria-expanded="false"
          aria-autocomplete="list"
        />
        <div id="scope" class="scope" hidden></div>
        <div id="found" class="found" hidden></div>
        <div id="results" class="results" role="listbox" hidden></div>
      </div>

      <section class="panel">
        <h2>Worlds</h2>
        <div id="worlds" class="worlds"></div>
      </section>

      <section id="display" class="panel">
        <h2>Display <button id="resetDisplay" class="mini" type="button">reset</button></h2>
        <div class="group">
          <label class="check"
            ><input type="checkbox" id="showSkins" checked /> Game textures <kbd>t</kbd></label
          >
          <label class="check"
            ><input type="checkbox" id="showObjects" checked /> Objects <kbd>o</kbd></label
          >
          <label class="check"
            ><input type="checkbox" id="showModels" data-needs="showObjects" checked /> Objects as
            models <kbd>d</kbd></label
          >
          <label class="check"
            ><input type="checkbox" id="showMotion" checked /> Motion <kbd>v</kbd></label
          >
        </div>
        <div class="group">
          <label class="check"
            ><input type="checkbox" id="showThrough" data-needs="showObjects" /> See objects through
            blocks <kbd>x</kbd></label
          >
          <label class="check"
            ><input type="checkbox" id="showLabels" data-needs="showObjects" /> Object labels
            <kbd>l</kbd></label
          >
          <label class="check"
            ><input type="checkbox" id="showFaces" data-needs="showLabels" /> Name the face in
            labels <kbd>n</kbd></label
          >
          <label class="check"
            ><input type="checkbox" id="showOutlines" /> Outlines <kbd>b</kbd></label
          >
          <label class="check"
            ><input type="checkbox" id="showBase" /> Ground grid <kbd>g</kbd></label
          >
        </div>
        <div class="group">
          <label class="check"
            ><input type="checkbox" id="panMode" /> Drag pans instead of turning <kbd>p</kbd></label
          >
          <div class="slice">
            <label for="slice"
              >Slice <span id="sliceVal" class="mono"></span> <kbd>,</kbd><kbd>.</kbd></label
            >
            <input type="range" id="slice" min="0" max="33" value="33" />
          </div>
          <label class="check"
            ><input type="checkbox" id="showHidden" data-needs="slice" /> Dim what the slice hides
            <kbd>h</kbd></label
          >
        </div>
      </section>

      <section class="panel">
        <h2>On this level <button id="resetKinds" class="mini" type="button">reset</button></h2>
        <div id="kinds" class="kinds"></div>
      </section>

      <p class="foot">
        <a href="https://retroatlas.org/">RetroAtlas</a> ·
        <a id="src" href="https://github.com/RetroAtlas/KulaWorldMap">source</a> ·
        <button id="aboutBtn" class="linkish" type="button">about this map</button>
      </p>
    </aside>

    <main class="map">
      <canvas id="cv" tabindex="0" role="img" aria-label="Level map"></canvas>
      <div id="chip" class="chip">
        <span id="chipLine" class="line"></span>
        <button id="chipBtn" type="button" aria-expanded="true" aria-controls="chipNote" hidden>
          <span id="chipDot" aria-hidden="true"></span>
        </button>
        <div id="chipNote" class="note" hidden></div>
      </div>
      <div id="readout" class="readout mono"></div>
      <div id="corner" class="corner" hidden>
        <button
          id="fitBtn"
          class="fit"
          type="button"
          aria-label="Fit the level"
          title="Fit the level (f)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5" />
            <path d="M12 7.5l4 2.25v4.5L12 16.5l-4-2.25v-4.5zM8 9.75l4 2.25 4-2.25M12 12v4.5" />
          </svg>
        </button>
        <canvas
          id="compass"
          class="compass"
          role="img"
          aria-label="Compass"
          title="A block turned as the level is, its faces and the ways they face named as the panel names them"
        ></canvas>
      </div>
      <div id="tip" class="tip" hidden></div>
      <div id="detail" class="detail" hidden></div>
      <div id="survey" class="survey" hidden></div>
      <div id="toastStack" class="toasts" aria-live="polite"></div>
    </main>
  </div>

  <div id="help" class="modal" role="dialog" aria-modal="true" hidden></div>

  <div
    id="settings"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="settingsTitle"
    hidden
  >
    <div class="box settings">
      <button class="x" type="button" title="Close (Esc)" aria-label="Close">×</button>
      <h3 id="settingsTitle">Settings</h3>
      <p>Settings will appear here.</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</html>
